# REVIEW ONLY: compare first; preserve existing Helm release and canary scope.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rca-agent-canary-onprem
  namespace: argocd
spec:
  project: rca-agent-canary-onprem
  source:
    repoURL: ssh://git@ssh.github.com:443/nembutal-sw/rca-platform-gitops.git
    targetRevision: main
    path: applications/onprem/agent/chart
    helm:
      releaseName: rca-agent-canary
      valueFiles:
        - ../../../../environments/onprem/agent/values.yaml
      kubeVersion: 1.36.5
      ignoreMissingValueFiles: false
      skipCrds: true
      skipTests: true
  destination:
    server: https://kubernetes.default.svc
    namespace: rca-system
  syncPolicy:
    syncOptions:
      - Prune=false
      - Delete=false
      - FailOnSharedResource=true
      - Replace=false
      - ServerSideApply=false
