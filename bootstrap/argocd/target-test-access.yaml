# Admin bootstrap in the NEW test namespace only. No wildcard, deletion, Secret,
# PVC, Pod mutation, RBAC mutation, exec, storage, or cluster-scoped resource rights.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-rca-test-controller
  namespace: rca-gitops-test
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, controllerrevisions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-rca-test-controller
  namespace: rca-gitops-test
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-rca-test-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-rca-test-server-readonly
  namespace: rca-gitops-test
rules:
  - apiGroups: [""]
    resources: [configmaps, pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, controllerrevisions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-rca-test-server-readonly
  namespace: rca-gitops-test
subjects:
  - kind: ServiceAccount
    name: argocd-server
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-rca-test-server-readonly
