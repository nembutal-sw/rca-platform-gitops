# Argo 3.5.5 shares discovery classification across its registered namespaces.
# Give the controller the same NONSECRET discovery reads in the NEW test namespace.
# No production access or write rights are added by this file.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-rca-test-discovery-readonly
  namespace: rca-gitops-test
rules:
  - apiGroups: ['']
    resources: [services, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors, alertmanagerconfigs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-rca-test-discovery-readonly
  namespace: rca-gitops-test
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-rca-test-discovery-readonly
