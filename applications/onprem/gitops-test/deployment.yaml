# Pin the public Python digest; worker cache metadata alone did not permit Never.
# IfNotPresent may fetch public manifest metadata and reuses available image layers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-gitops-proof
  namespace: rca-gitops-test
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rca-gitops-proof
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rca-gitops-proof
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/hostname: k8s-worker-02
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proof
          image: docker.io/library/python@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
          args:
            - |
              import http.server
              from pathlib import Path
              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      payload = Path('/proof/message').read_bytes().strip() + b'\n'
                      self.send_response(200)
                      self.send_header('Content-Type', 'text/plain; charset=utf-8')
                      self.send_header('Content-Length', str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)
                  def log_message(self, *_):
                      pass
              http.server.HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            - name: PYTHONUNBUFFERED
              value: '1'
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: proof
              mountPath: /proof
              readOnly: true
      volumes:
        - name: proof
          configMap:
            name: rca-gitops-proof
            defaultMode: 292
